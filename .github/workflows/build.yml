name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.5.2 rejects JDK 21+, so pin 17 rather than using whatever the runner defaults to.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Unit tests and release build
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: castfix-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
